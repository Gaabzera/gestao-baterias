<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcone Baterias - Gestão Operacional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .kanban-column {
            min-height: 550px;
            background: #f1f3f5;
            border-radius: 12px;
            padding: 15px;
        }
        .kanban-card {
            background: white;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: move;
        }
        .status-A_FAZER { border-left: 5px solid #0d6efd; }
        .status-EM_ANDAMENTO { border-left: 5px solid #ffc107; }
        .status-CONCLUIDO { border-left: 5px solid #198754; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">🔋 Marcone Baterias</span>
    </div>
</nav>

<div class="container">

    <div id="login-screen">
        <div class="row justify-content-center mt-5">
            <div class="col-md-4">
                <div class="card shadow p-4">
                    <div class="text-center mb-4">
                        <h2>🔐 Login</h2>
                        <p class="text-muted">Apenas gerentes e mecânicos autorizados</p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Usuário</label>
                        <input id="username" type="text" class="form-control" value="gerente" placeholder="gerente ou mecanico1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input id="password" type="password" class="form-control" value="123">
                    </div>

                    <button onclick="fazerLogin()" class="btn btn-primary w-100 py-3">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar no Sistema
                    </button>

                    <div class="text-center mt-3 small text-muted">
                        Usuários de teste:<br>
                        gerente / 123<br>
                        mecanico1 / 123<br>
                        mecanico2 / 123
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="dashboard-screen" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>📋 Quadro Kanban - Ordens de Serviço</h3>
            <div>
                <button onclick="abrirModalNovaOrdem()" class="btn btn-success me-2">
                    + Nova Ordem
                </button>
                <button onclick="logout()" class="btn btn-outline-danger">Sair</button>
            </div>
        </div>

        <div class="row g-3" id="kanban">
            <!-- Kanban gerado pelo JavaScript -->
        </div>
    </div>
</div>

<div class="modal fade" id="modalNovaOrdem" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">🚗 Nova Ordem de Serviço</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label>Placa do Veículo</label>
                        <input id="placa" type="text" class="form-control" placeholder="ABC-1234">
                    </div>
                    <div class="col-md-6">
                        <label>Nome do Cliente</label>
                        <input id="cliente" type="text" class="form-control">
                    </div>
                    <div class="col-12">
                        <label>Descrição dos Serviços</label>
                        <textarea id="descricao" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label>Mecânico Responsável</label>
                        <select id="mecanico" class="form-select">
                            <option>Mecânico 1</option>
                            <option>Mecânico 2</option>
                            <option>Mecânico 3</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label>Prazo Prometido</label>
                        <input id="prazo" type="date" class="form-control">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button onclick="criarOrdem()" class="btn btn-primary">Criar Ordem</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    let ordens = [];

    function fazerLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (username === "" || password === "") {
            alert("Por favor, preencha usuário e senha.");
            return;
        }

        if (password === "123") {
            document.getElementById('login-screen').classList.add('d-none');
            document.getElementById('dashboard-screen').classList.remove('d-none');
            carregarOrdens();
        } else {
            alert("Senha incorreta! Use 123 para os usuários de teste.");
        }
    }

    async function carregarOrdens() {
        try {
            const res = await fetch('http://localhost:8080/api/ordens');
            if (res.ok) ordens = await res.json();
        } catch (e) {
            console.log("Usando dados locais");
            ordens = ordens.length > 0 ? ordens : [
                {id:1, placaVeiculo:"ABC-1234", nomeCliente:"João Silva", descricao:"Troca de bateria", mecanicoResponsavel:"Mecânico 1", status:"A_FAZER"},
                {id:2, placaVeiculo:"XYZ-9876", nomeCliente:"Maria Oliveira", descricao:"Instalação de bateria", mecanicoResponsavel:"Mecânico 2", status:"EM_ANDAMENTO"}
            ];
        }
        renderKanban();
    }

    function renderKanban() {
        const kanbanHTML = `
        <div class="col-md-4">
            <div class="kanban-column" ondrop="drop(event)" ondragover="allowDrop(event)" data-status="A_FAZER">
                <h5 class="text-primary">📋 A Fazer (${ordens.filter(o => o.status === 'A_FAZER').length})</h5>
                ${ordens.filter(o => o.status === 'A_FAZER').map(criarCard).join('')}
            </div>
        </div>
        <div class="col-md-4">
            <div class="kanban-column" ondrop="drop(event)" ondragover="allowDrop(event)" data-status="EM_ANDAMENTO">
                <h5 class="text-warning">🔧 Em Andamento (${ordens.filter(o => o.status === 'EM_ANDAMENTO').length})</h5>
                ${ordens.filter(o => o.status === 'EM_ANDAMENTO').map(criarCard).join('')}
            </div>
        </div>
        <div class="col-md-4">
            <div class="kanban-column" ondrop="drop(event)" ondragover="allowDrop(event)" data-status="CONCLUIDO">
                <h5 class="text-success">✅ Concluído (${ordens.filter(o => o.status === 'CONCLUIDO').length})</h5>
                ${ordens.filter(o => o.status === 'CONCLUIDO').map(criarCard).join('')}
            </div>
        </div>
    `;
        document.getElementById('kanban').innerHTML = kanbanHTML;
    }

    function criarCard(o) {
        return `
        <div class="kanban-card status-${o.status}" draggable="true" ondragstart="drag(event)" data-id="${o.id}">
            <strong>${o.placaVeiculo}</strong><br>
            <small>${o.nomeCliente}</small><br>
            <small class="text-muted">${o.descricao}</small><br>
            <small><i class="bi bi-person"></i> ${o.mecanicoResponsavel}</small>
        </div>`;
    }

    function allowDrop(ev) { ev.preventDefault(); }
    function drag(ev) { ev.dataTransfer.setData("text", ev.target.getAttribute("data-id")); }

    async function drop(ev) {
        ev.preventDefault();
        const id = parseInt(ev.dataTransfer.getData("text"));
        const novoStatus = ev.currentTarget.getAttribute("data-status");

        try {
            await fetch(`http://localhost:8080/api/ordens/${id}/status?status=${novoStatus}`, { method: 'PUT' });
        } catch (e) {
            const ordem = ordens.find(o => o.id === id);
            if (ordem) ordem.status = novoStatus;
        }
        carregarOrdens();
    }

    function abrirModalNovaOrdem() {
        document.getElementById('modalNovaOrdem').querySelectorAll('input, textarea').forEach(i => i.value = '');
        new bootstrap.Modal(document.getElementById('modalNovaOrdem')).show();
    }

    async function criarOrdem() {
        const ordem = {
            placaVeiculo: document.getElementById('placa').value || "SEM-PLACA",
            nomeCliente: document.getElementById('cliente').value || "Cliente não informado",
            descricao: document.getElementById('descricao').value,
            mecanicoResponsavel: document.getElementById('mecanico').value,
            status: "A_FAZER"
        };

        try {
            await fetch('http://localhost:8080/api/ordens', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(ordem)
            });
        } catch (e) {
            ordem.id = Date.now();
            ordens.push(ordem);
        }

        carregarOrdens();
        bootstrap.Modal.getInstance(document.getElementById('modalNovaOrdem')).hide();
    }

    // ====================== SAIR ======================
    function logout() {
        document.getElementById('dashboard-screen').classList.add('d-none');
        document.getElementById('login-screen').classList.remove('d-none');
    }
</script>
</body>
</html>
